name: E2E Tests

on:
  workflow_dispatch:
  push:
  pull_request:
  merge_group:
    types: [checks_requested]

jobs:
  test-e2e:
    name: Run on Ubuntu
    # kind needs headroom + docker; avoid concurrent collision on shared runners
    runs-on: sylphx-linux-xlarge
    timeout-minutes: 45
    concurrency:
      group: talos-fleet-controller-kind-e2e
      cancel-in-progress: false
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Detect product source changes
        id: product_changes
        run: bash .github/scripts/product-source-affected.sh

      - name: Skip product e2e
        if: steps.product_changes.outputs.product_changed == 'false'
        run: echo "No product source changes detected; product e2e is not affected."

      - name: Setup Go
        if: steps.product_changes.outputs.product_changed != 'false'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install kind (pinned)
        if: steps.product_changes.outputs.product_changed != 'false'
        run: |
          set -euo pipefail
          # Pin for reproducible self-hosted behavior (latest drift has broken kubeadm wait on shared docker).
          KIND_VERSION=v0.27.0
          curl -fsSL -o ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        if: steps.product_changes.outputs.product_changed != 'false'
        run: kind version

      - name: Ensure Docker is available
        if: steps.product_changes.outputs.product_changed != 'false'
        run: |
          set -euo pipefail
          docker info
          docker version
          # Shared runners accumulate dead kind networks/containers; clear only kind leftovers.
          docker ps -a --filter "name=kind" --format '{{.ID}} {{.Names}}' || true
          docker network ls --filter "name=kind" || true

      - name: Running Test e2e
        if: steps.product_changes.outputs.product_changed != 'false'
        env:
          # Isolate clusters across concurrent shared-runner jobs
          KIND_CLUSTER: talos-fleet-controller-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          go mod tidy
          if ! make test-e2e; then
            echo "::group::kind diagnostics"
            kind get clusters || true
            docker ps -a || true
            docker logs "${KIND_CLUSTER}-control-plane" 2>/dev/null | tail -200 || true
            echo "::endgroup::"
            make cleanup-test-e2e || true
            exit 1
          fi
          make cleanup-test-e2e
