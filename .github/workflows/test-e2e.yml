name: E2E Tests

on:
  workflow_dispatch:
  # PRs own feature-branch validation. Keep push runs for durable trunk/dev
  # postsubmit proof, rather than consuming the runner fleet twice per PR.
  push:
    branches: [main, dev]
  pull_request:
  merge_group:
    types: [checks_requested]

jobs:
  test-e2e:
    name: Run on Ubuntu
    runs-on: sylphx-linux-standard
    timeout-minutes: 45
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Verify owned runner selector policy
        run: bash .github/scripts/check-owned-runner-profiles.sh

      - name: Detect product source changes
        id: product_changes
        run: bash .github/scripts/product-source-affected.sh

      - name: Skip product e2e
        if: steps.product_changes.outputs.product_changed == 'false'
        run: echo "No product source changes detected; product e2e is not affected."

      - name: Setup Go
        if: steps.product_changes.outputs.product_changed != 'false'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        if: steps.product_changes.outputs.product_changed != 'false'
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        if: steps.product_changes.outputs.product_changed != 'false'
        run: kind version

      - name: Running Test e2e
        if: steps.product_changes.outputs.product_changed != 'false'
        run: |
          go mod tidy
          KIND_CREATE_ARGS=--retain make test-e2e

      # The owned standard runner reproduces a Kind control-plane bootstrap
      # failure that does not occur on the former hosted runner. Keep the
      # failure evidence bounded and available for the Platform-owned runner
      # capability fix; never bypass it with GitHub-hosted compute.
      - name: Export Kind diagnostics on failure
        if: failure() && steps.product_changes.outputs.product_changed != 'false'
        run: |
          mkdir -p kind-logs
          kind export logs kind-logs --name talos-fleet-controller-test-e2e || true
          find kind-logs -maxdepth 2 -type f -print | sort | sed -n '1,200p'

      - name: Upload Kind diagnostics on failure
        if: failure() && steps.product_changes.outputs.product_changed != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: kind-e2e-diagnostics-${{ github.run_id }}
          path: kind-logs
          if-no-files-found: warn
          retention-days: 7
