name: Tests

on:
  workflow_dispatch:
  # PRs own feature-branch validation. Keep push runs for durable trunk/dev
  # postsubmit proof, rather than consuming the runner fleet twice per PR.
  push:
    branches: [main, dev]
  pull_request:
  merge_group:
    types: [checks_requested]

jobs:
  test:
    name: Run on Ubuntu
    runs-on: sylphx-linux-standard
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Verify owned runner selector policy
        run: bash .github/scripts/check-owned-runner-profiles.sh

      - name: Detect product source changes
        id: product_changes
        run: bash .github/scripts/product-source-affected.sh

      - name: Skip product tests
        if: steps.product_changes.outputs.product_changed == 'false'
        run: echo "No product source changes detected; product tests are not affected."

      - name: Setup Go
        if: steps.product_changes.outputs.product_changed != 'false'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Running Tests
        if: steps.product_changes.outputs.product_changed != 'false'
        run: |
          go mod tidy
          make test
