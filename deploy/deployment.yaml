apiVersion: apps/v1
kind: Deployment
metadata:
  name: tfc-controller
  namespace: tfc-system
  labels:
    app.kubernetes.io/name: talos-fleet-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: talos-fleet-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: talos-fleet-controller
    spec:
      serviceAccountName: tfc-controller
      containers:
        - name: manager
          image: registry.sylphx.com/library/talos-fleet-controller:main
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            - --metrics-secure=false
          env:
            - name: TALOSCONFIG
              value: /var/run/secrets/talos.dev/config
          ports:
            - containerPort: 8081
              name: health
            - containerPort: 8080
              name: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: talos-secrets
              mountPath: /var/run/secrets/talos.dev
              readOnly: true
      volumes:
        - name: talos-secrets
          secret:
            # Created automatically by Talos ServiceAccount CRD controller
            # from deploy/talos-serviceaccount.yaml
            secretName: tfc-talos-api
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tfc-controller
  namespace: tfc-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tfc-controller
rules:
  # FleetNodeSet CRD
  - apiGroups: [fleet.talos.dev]
    resources: [fleetnodesets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [fleet.talos.dev]
    resources: [fleetnodesets/status]
    verbs: [get, update, patch]
  - apiGroups: [fleet.talos.dev]
    resources: [fleetnodesets/finalizers]
    verbs: [update]
  # Nodes — read + cordon/uncordon
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch, update, patch]
  # Pods — for drain
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  # Secrets — for Talos ServiceAccount + machineConfig secretRef
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  # Events — for recording reconcile events
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  # Leader election
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tfc-controller
subjects:
  - kind: ServiceAccount
    name: tfc-controller
    namespace: tfc-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tfc-controller
