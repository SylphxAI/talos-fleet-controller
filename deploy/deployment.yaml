# Raw deploy manifests for the CAPI Runtime SDK extension server.
# The Helm chart (charts/talos-fleet-controller) is the canonical install
# path and automates the serving-certificate flow; these manifests mirror it
# for kubectl-only installs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tfc-controller
  namespace: tfc-system
  labels:
    app.kubernetes.io/name: talos-fleet-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: talos-fleet-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: talos-fleet-controller
    spec:
      serviceAccountName: tfc-controller
      containers:
        - name: manager
          image: ghcr.io/sylphxai/talos-fleet-controller:main
          args:
            - --webhook-port=9443
            - --webhook-cert-dir=/tmp/k8s-webhook-server/serving-certs
          env:
            - name: TALOSCONFIG
              value: /var/run/secrets/talos.dev/config
          ports:
            - containerPort: 9443
              name: webhook
          # The extension server has no HTTP health endpoints; the TLS
          # listener only comes up after serving certs load, so a TCP
          # probe on the webhook port is the health signal.
          livenessProbe:
            tcpSocket:
              port: webhook
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: webhook
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
            - name: talos-secrets
              mountPath: /var/run/secrets/talos.dev
              readOnly: true
      volumes:
        - name: webhook-certs
          secret:
            # TLS serving cert (tls.crt / tls.key, plus ca.crt for CAPI
            # caBundle injection). Create via cert-manager or manually —
            # see charts/talos-fleet-controller/README.md. The binary does
            # not self-generate certificates.
            secretName: tfc-webhook-cert
        - name: talos-secrets
          secret:
            # Created automatically by Talos ServiceAccount CRD controller
            # from deploy/talos-serviceaccount.yaml
            secretName: tfc-talos-api
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
---
# Webhook Service targeted by the CAPI ExtensionConfig clientConfig when
# the extension is registered (RuntimeSDK feature gate required).
apiVersion: v1
kind: Service
metadata:
  name: tfc-webhook
  namespace: tfc-system
  labels:
    app.kubernetes.io/name: talos-fleet-controller
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: talos-fleet-controller
  ports:
    - name: https
      port: 443
      targetPort: webhook
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tfc-controller
  namespace: tfc-system
---
# Scoped to what the current binary calls: Machine/Node GETs for node IP
# lookup and the in-place update config-cache ConfigMap.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tfc-controller
rules:
  # CAPI Machines — read for node IP lookup during UpdateMachine
  - apiGroups: [cluster.x-k8s.io]
    resources: [machines]
    verbs: [get]
  # Nodes — fallback node IP lookup via Machine status.nodeRef
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
  # ConfigMaps — in-place update config cache
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tfc-controller
subjects:
  - kind: ServiceAccount
    name: tfc-controller
    namespace: tfc-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tfc-controller
