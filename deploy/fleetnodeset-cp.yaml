# FleetNodeSet for production control plane nodes.
#
# NOTE: the current controller binary contains no FleetNodeSet reconciler
# (it is a CAPI Runtime SDK in-place update extension) — this CR is stored
# as declarative intent for the future convergence feature.
apiVersion: fleet.talos.dev/v1alpha1
kind: FleetNodeSet
metadata:
  name: control-plane
  namespace: tfc-system
spec:
  # Safety default: ship paused. Unpausing is a deliberate operator action
  # once the convergence reconciler exists and overrides are generated.
  paused: true

  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/control-plane: ""

  talos:
    version: v1.12.4
    schematic: 3da7f440f279f4814fa73bdf83c84710a8e93c40a4a3cbba4d969f14afb96298
    factoryURL: https://factory.talos.dev

  machineConfig:
    inline: |
      machine:
        kernel:
          modules:
            - name: dm_thin_pool
        kubelet:
          extraArgs:
            max-pods: "250"
            register-with-taints: node.cilium.io/agent-not-ready=true:NoSchedule
          extraMounts:
            - destination: /var/mnt/topolvm
              type: bind
              source: /var/mnt/topolvm
              options: [bind, rshared, rw]
        nodeLabels:
          katacontainers.io/kata-runtime: "true"
          topolvm.io/node: "true"
          node.kubernetes.io/exclude-from-external-load-balancers: ""
        sysctls:
          net.ipv6.conf.all.forwarding: "1"
        features:
          kubernetesTalosAPIAccess:
            enabled: true
            allowedRoles: [os:admin]
            allowedKubernetesNamespaces: [tfc-system]
      cluster:
        controlPlane:
          endpoint: https://10.10.0.240:6443
        network:
          cni:
            name: none
        proxy:
          disabled: true
        allowSchedulingOnControlPlanes: true

  # Per-node overrides MUST be generated from live cluster inventory
  # (hostname, MAC, IPs, provider ID per machine) — never hand-copied.
  # A previous revision of this file listed WORKER machines
  # (compute-fsn1-2920324/2927556/2932787, VLAN IPs 10.10.0.1/.2/.4) as
  # control-plane overrides; copying it nearly pushed control-plane config
  # (including the API VIP) onto worker nodes. Left intentionally empty.
  nodeOverrides: []

  updateStrategy:
    maxUnavailable: 1
    configApplyMode: auto
    drainTimeout: 300s
    healthCheckTimeout: 120s
