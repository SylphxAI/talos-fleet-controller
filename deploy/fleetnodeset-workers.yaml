# FleetNodeSet for our production worker nodes.
apiVersion: fleet.talos.dev/v1alpha1
kind: FleetNodeSet
metadata:
  name: workers
  namespace: tfc-system
spec:
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist

  talos:
    version: v1.12.4
    schematic: 3da7f440f279f4814fa73bdf83c84710a8e93c40a4a3cbba4d969f14afb96298
    factoryURL: https://factory.talos.dev

  machineConfig:
    inline: |
      machine:
        kernel:
          modules:
            - name: dm_thin_pool
        kubelet:
          extraArgs:
            max-pods: "250"
            register-with-taints: node.cilium.io/agent-not-ready=true:NoSchedule
          extraMounts:
            - destination: /var/mnt/topolvm
              type: bind
              source: /var/mnt/topolvm
              options: [bind, rshared, rw]
        nodeLabels:
          katacontainers.io/kata-runtime: "true"
          topolvm.io/node: "true"
        sysctls:
          net.ipv6.conf.all.forwarding: "1"
        # kubernetesTalosAPIAccess is CP-only — workers accessed via Talos API proxy on CPs
      cluster:
        controlPlane:
          endpoint: https://10.10.0.240:6443
        network:
          cni:
            name: none
        proxy:
          disabled: true

  nodeOverrides:
    # node6 (serverID 2938104)
    - nodeSelector:
        matchLabels:
          kubernetes.io/hostname: compute-fsn1-2938104
      machineConfig:
        inline: |
          machine:
            network:
              hostname: compute-fsn1-2938104
              interfaces:
                - deviceSelector:
                    hardwareAddr: "a0:ad:9f:28:27:1b"
                    physical: true
                  dhcp: true
                  addresses: ["2a01:4f8:2210:1a2e::1/64"]
                  routes:
                    - gateway: "fe80::1"
                      network: "::/0"
                  vlans:
                    - vlanId: 4000
                      addresses: ["10.10.0.6/24"]
            kubelet:
              extraArgs:
                node-ip: "10.10.0.6,2a01:4f8:2210:1a2e::1"
                provider-id: "hetzner-robot://2938104"

    # node7 (serverID 2957069)
    - nodeSelector:
        matchLabels:
          kubernetes.io/hostname: compute-fsn1-2957069
      machineConfig:
        inline: |
          machine:
            network:
              hostname: compute-fsn1-2957069
              interfaces:
                - deviceSelector:
                    hardwareAddr: "9c:6b:00:72:50:36"
                    physical: true
                  dhcp: true
                  addresses: ["2a01:4f8:2220:2f8a::1/64"]
                  routes:
                    - gateway: "fe80::1"
                      network: "::/0"
                  vlans:
                    - vlanId: 4000
                      addresses: ["10.10.0.7/24"]
            kubelet:
              extraArgs:
                node-ip: "10.10.0.7,2a01:4f8:2220:2f8a::1"
                provider-id: "hetzner-robot://2957069"

    # node8 (serverID 2958377)
    - nodeSelector:
        matchLabels:
          kubernetes.io/hostname: compute-fsn1-2958377
      machineConfig:
        inline: |
          machine:
            network:
              hostname: compute-fsn1-2958377
              interfaces:
                - deviceSelector:
                    hardwareAddr: "9c:6b:00:77:cd:3a"
                    physical: true
                  dhcp: true
                  addresses: ["2a01:4f8:2220:288d::1/64"]
                  routes:
                    - gateway: "fe80::1"
                      network: "::/0"
                  vlans:
                    - vlanId: 4000
                      addresses: ["10.10.0.8/24"]
            kubelet:
              extraArgs:
                node-ip: "10.10.0.8,2a01:4f8:2220:288d::1"
                provider-id: "hetzner-robot://2958377"

  updateStrategy:
    maxUnavailable: 1
    configApplyMode: auto
    drainTimeout: 300s
    healthCheckTimeout: 120s
