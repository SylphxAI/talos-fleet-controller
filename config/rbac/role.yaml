---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - fleet.talos.dev
  resources:
  - fleetnodesets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - fleet.talos.dev
  resources:
  - fleetnodesets/finalizers
  verbs:
  - update
- apiGroups:
  - fleet.talos.dev
  resources:
  - fleetnodesets/status
  verbs:
  - get
  - patch
  - update
