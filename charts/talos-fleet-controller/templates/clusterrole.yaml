{{- if .Values.rbac.create }}
# RBAC is scoped to what the current binary actually calls (see
# internal/handlers): direct client GETs of CAPI Machines and Nodes for
# node IP lookup, plus a ConfigMap used as the in-place update config
# cache. Talos API credentials come from the mounted talos.dev
# ServiceAccount Secret, not the Kubernetes API. The former
# controller-manager rules (fleetnodesets, pods/eviction, events, leases)
# will return together with the FleetNodeSet reconciler.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "talos-fleet-controller.fullname" . }}
  labels:
    {{- include "talos-fleet-controller.labels" . | nindent 4 }}
rules:
  # CAPI Machines — read for node IP lookup during UpdateMachine.
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["machines"]
    verbs: ["get"]
  # Nodes — fallback node IP lookup via Machine status.nodeRef.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
  # ConfigMaps — persist the in-place update config cache.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update"]
{{- end }}
