{{- if .Values.talosServiceAccount.create }}
# Talos ServiceAccount grants the controller access to the Talos gRPC API.
# The Talos CRD controller watches this resource, validates the namespace
# is in kubernetesTalosAPIAccess.allowedKubernetesNamespaces, generates
# a TLS client certificate, and creates a K8s Secret with the talosconfig.
#
# Prerequisites — all managed nodes must have:
#   machine:
#     features:
#       kubernetesTalosAPIAccess:
#         enabled: true
#         allowedRoles: [os:admin]
#         allowedKubernetesNamespaces: [{{ include "talos-fleet-controller.namespace" . }}]
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: {{ include "talos-fleet-controller.talosServiceAccountName" . }}
  namespace: {{ include "talos-fleet-controller.namespace" . }}
  labels:
    {{- include "talos-fleet-controller.labels" . | nindent 4 }}
spec:
  roles:
    {{- toYaml .Values.talosServiceAccount.roles | nindent 4 }}
{{- end }}
