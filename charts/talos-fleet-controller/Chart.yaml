apiVersion: v2
name: talos-fleet-controller
description: Talos Linux fleet management. The current binary is a Cluster API Runtime SDK extension server implementing in-place update hooks (CanUpdateMachine, CanUpdateMachineSet, UpdateMachine) over the Talos API. The FleetNodeSet CRD ships as declarative intent for the future config-convergence reconciler.
type: application
version: 0.2.0
